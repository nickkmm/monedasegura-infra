<svg id="archEjemplo" viewBox="0 0 1056 516" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title id="archEjemplo-t">Architecture diagram example</title>
<desc id="archEjemplo-d">A Flutter app calls booking-api; the API stores in postgres, charges through an external gateway, publishes events to kafka for a notifier that sends mail, and uses a cache as contingency.</desc>
<style>
#archEjemplo .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
#archEjemplo .nn{font-size:14px;font-weight:700}
#archEjemplo .tech{font-size:12px;fill:#556074}
#archEjemplo .bd{font-size:10.5px;font-weight:700;fill:#fff;letter-spacing:.04em}
#archEjemplo .zl{font-size:11.5px;font-weight:700;fill:#79809A;letter-spacing:.06em}
#archEjemplo .el{font-size:11.5px;fill:#556074}
#archEjemplo .st{font-size:11px;font-weight:700;fill:#fff}
#archEjemplo .lg{font-size:12px;fill:#556074}
</style>
<defs><marker id="archEjemplo-a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#161A26"/></marker><marker id="archEjemplo-a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#556074"/></marker><marker id="archEjemplo-a-contingency" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker></defs>
<rect width="1056" height="516" rx="16" fill="#FBFBFD"/>
<text x="32" y="44" font-size="20" font-weight="700" fill="#161A26">Example: court booking</text>
<text x="32" y="66" font-size="13" fill="#79809A">Each box is a component; each arrow is a connection. Numbers follow the path the user waits for.</text>
