# MonedaSegura local stack.
#
#   cp .env.example .env
#   docker compose up -d                      # infrastructure only: postgres, redis, kafka
#   docker compose --profile apps up -d       # + decision-service, scoring-service, app
#   docker compose --profile seed run --rm seed-job   # load the colombianized Sparkov seed once
#   docker compose --profile tools up -d      # + kafka-ui for debugging
#
# The `apps` and `seed` profiles build the sibling repos, which must be cloned next to
# this one inside the SecureMoney/ workspace folder (see README "Running locally").

name: monedasegura

services:
  # ------------------------------------------------------------------ infrastructure
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.1-alpine
    # Online features are a rebuildable cache (Postgres is the source of truth): no persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    # Single broker in KRaft mode (no ZooKeeper).
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.0
    # Creates the topics once Kafka is up, then exits.
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic decisions --partitions 3 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic decisions
    restart: "no"

  # ------------------------------------------------------------------ own services (sibling repos)
  decision-service:
    profiles: ["apps"]
    build: ../monedasegura-decision-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCORING_SERVICE_URL: http://scoring-service:8000
      SCORING_SERVICE_TOKEN: ${SCORING_SERVICE_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      TZ: America/Bogota
    ports:
      - "${DECISION_SERVICE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      scoring-service:
        condition: service_started

  scoring-service:
    profiles: ["apps"]
    build: ../monedasegura-scoring-service
    environment:
      SCORING_SERVICE_TOKEN: ${SCORING_SERVICE_TOKEN}
      MODEL_DIR: /models
    ports:
      - "${SCORING_SERVICE_PORT:-8000}:8000"
    volumes:
      - models:/models

  app:
    profiles: ["apps"]
    # Flutter web build served by a static web server inside the image.
    build: ../monedasegura-app
    environment:
      API_BASE_URL: http://localhost:${DECISION_SERVICE_PORT:-8080}/api/v1
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      - decision-service

  # ------------------------------------------------------------------ one-off jobs
  seed-job:
    profiles: ["seed"]
    # Same image as scoring-service; runs its seed command (docs/data.md) and exits.
    build: ../monedasegura-scoring-service
    command: ["seed"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SEED_CUSTOMERS: ${SEED_CUSTOMERS:-200}
      SEED_MONTHS: ${SEED_MONTHS:-6}
      SEED_RANDOM_SEED: ${SEED_RANDOM_SEED:-42}
      USD_TO_COP: ${USD_TO_COP:-4000}
    volumes:
      - seed-cache:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------------------ debugging tools
  kafka-ui:
    profiles: ["tools"]
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pgdata:
  models:
  seed-cache:
