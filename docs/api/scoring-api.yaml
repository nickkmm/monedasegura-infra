openapi: 3.1.0
info:
  title: MonedaSegura scoring-api
  version: 1.0.0
  summary: Fraud scoring and model training, called only by the decision-service.
  description: |
    Internal service owned by `monedasegura-scoring-service` (FastAPI + LightGBM).
    Its only client is `monedasegura-decision-service`; the Flutter app never calls it.

    - The decision-service owns the model registry (`model_version` table) and decides
      which version is active; this service writes the model files to the `models`
      bucket (object storage with the S3 API, SeaweedFS in docker-compose) and serves the
      version it was told to serve (`PUT /active-model`). The active model is kept in
      memory: `/score` never reads the bucket.
    - Feature names and meanings are defined once in `docs/features.md`.
    - `POST /score` is on the critical path: the decision-service calls it behind a
      circuit breaker with a short timeout and falls back to rules only when it fails.
servers:
  - url: http://scoring-service:8000
    description: Inside docker-compose
  - url: http://localhost:8000
    description: Local development
security:
  - serviceToken: []
tags:
  - name: scoring
    description: Fraud probability for one transaction (critical path)
  - name: models
    description: Training and serving of model versions
  - name: health
    description: Liveness for healthchecks and the circuit breaker

paths:
  /score:
    post:
      tags: [scoring]
      operationId: scoreTransaction
      summary: Score one transaction
      description: Returns the fraud probability for a feature vector using the active model. Target p99 latency is 50 ms.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScoreRequest' }
            example:
              transactionId: 7f0b6a4e-2c1d-4b7e-9a51-3f7d2a9c1e10
              features:
                amount: 1560000
                amount_vs_avg_30d: 5.3
                spend_24h: 2100000
                tx_count_5m: 3
                tx_count_1h: 6
                same_amount_counterparty_10m: 0
                minutes_since_prev: 4
                km_from_home: 6.2
                km_from_prev: 1.1
                implied_speed_kmh: 16.5
                hour_of_day: 2
                is_night: true
                category: shopping_net
                is_new_device: false
                device_age_days: 210
                customers_on_device: 1
                failed_logins_1h: 0
                password_changed_24h: false
                account_age_days: 640
      responses:
        '200':
          description: Score computed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreResponse' }
              example: { transactionId: 7f0b6a4e-2c1d-4b7e-9a51-3f7d2a9c1e10, score: 0.9312, modelVersion: v3, latencyMs: 4 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: No model loaded; the decision-service must decide with rules only (degraded).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /retrain:
    post:
      tags: [models]
      operationId: retrainModel
      summary: Train a new candidate model
      description: |
        Trains a LightGBM model on the labeled rows sent by the decision-service, uploads
        `{version}/model.txt` and `{version}/metadata.json` (feature names and order,
        metrics) to the `models` bucket and reports validation metrics plus where the file
        is. A version is never overwritten: an existing `{version}` key is a `409`.
        It does **not** activate the model: the decision-service applies the quality gate
        (`docs/model.md` §8) and then calls `PUT /active-model`.
        Synchronous: expected to finish in seconds for the MVP data volume; the caller
        uses a timeout of 120 s.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetrainRequest' }
      responses:
        '201':
          description: Candidate model trained and stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainedModel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: That version already exists in the bucket; nothing was overwritten.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Not enough rows, or a single class only; nothing was trained.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /active-model:
    get:
      tags: [models]
      operationId: getActiveModel
      summary: Version currently served by /score
      responses:
        '200':
          description: Active model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No model loaded yet
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      tags: [models]
      operationId: setActiveModel
      summary: Load a stored version and serve it from /score
      description: |
        Downloads the file from `artifactUri`, checks its SHA-256, loads it into memory and
        only then swaps it for the model being served, so `/score` is never left without a
        model. If any step fails, the previous model keeps serving and nothing changes.
        The decision-service calls it on activation and again whenever `/health` reports an
        `activeModel` different from its `ACTIVE` version (for example after a restart,
        when this service starts with no model).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, artifactUri, sha256]
              properties:
                version: { type: string, example: v4 }
                artifactUri: { type: string, example: 's3://models/v4/model.txt', description: 'From `model_version.artifact_uri`.' }
                sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: 'From `model_version.artifact_sha256`.' }
      responses:
        '200':
          description: Version loaded and now active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No file at `artifactUri`; the previous model keeps serving.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The file's SHA-256 does not match; the previous model keeps serving.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /models/{version}:
    get:
      tags: [models]
      operationId: getModel
      summary: Metadata of a stored model
      description: Read from `{version}/metadata.json` in the `models` bucket.
      parameters:
        - name: version
          in: path
          required: true
          schema: { type: string, example: v3 }
      responses:
        '200':
          description: Stored model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainedModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Unknown version
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness and readiness
      description: Used by docker-compose healthchecks and by the circuit breaker's half-open probe. No authentication.
      security: []
      responses:
        '200':
          description: Service up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

components:
  securitySchemes:
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Shared secret between decision-service and scoring-service, read from the environment (`SCORING_SERVICE_TOKEN`). Never committed.

  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or wrong X-Service-Token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Features:
      type: object
      description: Feature vector v1. Names, meanings and defaults in `docs/features.md`.
      additionalProperties: false
      required: [amount, amount_vs_avg_30d, spend_24h, tx_count_5m, tx_count_1h, same_amount_counterparty_10m, minutes_since_prev, km_from_home, km_from_prev, implied_speed_kmh, hour_of_day, is_night, category, is_new_device, device_age_days, customers_on_device, failed_logins_1h, password_changed_24h, account_age_days]
      properties:
        amount: { type: number, minimum: 0, description: COP }
        amount_vs_avg_30d: { type: number, minimum: 0 }
        spend_24h: { type: number, minimum: 0, description: COP }
        tx_count_5m: { type: integer, minimum: 0 }
        tx_count_1h: { type: integer, minimum: 0 }
        same_amount_counterparty_10m: { type: integer, minimum: 0 }
        minutes_since_prev: { type: number, minimum: 0 }
        km_from_home: { type: number, minimum: 0 }
        km_from_prev: { type: number, minimum: 0 }
        implied_speed_kmh: { type: number, minimum: 0, maximum: 2000 }
        hour_of_day: { type: integer, minimum: 0, maximum: 23 }
        is_night: { type: boolean }
        category: { type: string, example: shopping_net }
        is_new_device: { type: boolean }
        device_age_days: { type: number, minimum: 0 }
        customers_on_device: { type: integer, minimum: 1 }
        failed_logins_1h: { type: integer, minimum: 0 }
        password_changed_24h: { type: boolean }
        account_age_days: { type: number, minimum: 0 }

    ScoreRequest:
      type: object
      required: [transactionId, features]
      properties:
        transactionId: { type: string, format: uuid, description: For logging and tracing only. }
        features: { $ref: '#/components/schemas/Features' }

    ScoreResponse:
      type: object
      required: [transactionId, score, modelVersion, latencyMs]
      properties:
        transactionId: { type: string, format: uuid }
        score: { type: number, minimum: 0, maximum: 1, description: Fraud probability. }
        modelVersion: { type: string, example: v3 }
        latencyMs: { type: integer, minimum: 0, description: Inference time inside this service. }

    TrainingRow:
      type: object
      required: [features, label]
      properties:
        features: { $ref: '#/components/schemas/Features' }
        label: { type: integer, enum: [0, 1], description: '1 = fraud (CONFIRMED_FRAUD or DATASET_FRAUD), 0 = legitimate.' }

    RetrainRequest:
      type: object
      required: [version, trigger, rows]
      properties:
        version: { type: string, example: v4, description: Version name assigned by the decision-service registry. }
        trigger: { type: string, enum: [SCHEDULED, MANUAL] }
        rows:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TrainingRow' }
        validationFraction: { type: number, minimum: 0.1, maximum: 0.5, default: 0.2 }
        randomSeed: { type: integer, default: 42 }

    Metrics:
      type: object
      required: [prAuc, precision, recall, rows, positives, featureImportance]
      properties:
        prAuc: { type: number, minimum: 0, maximum: 1 }
        rocAuc: { type: number, minimum: 0, maximum: 1 }
        precision: { type: number, minimum: 0, maximum: 1, description: At a 0.5 threshold on the validation split. }
        recall: { type: number, minimum: 0, maximum: 1, description: At a 0.5 threshold on the validation split. }
        rows: { type: integer, minimum: 0 }
        positives: { type: integer, minimum: 0 }
        featureImportance:
          type: object
          description: Gain share of each feature (names from `docs/features.md`); values sum to 1.
          additionalProperties: { type: number, minimum: 0, maximum: 1 }
          example: { amount_vs_avg_30d: 0.31, is_new_device: 0.24, tx_count_1h: 0.19 }

    TrainedModel:
      type: object
      required: [version, algorithm, featureSchemaVersion, metrics, artifactUri, sha256, trainedAt]
      properties:
        version: { type: string, example: v4 }
        algorithm: { type: string, enum: [LIGHTGBM] }
        artifactUri: { type: string, example: 's3://models/v4/model.txt', description: 'Stored by the decision-service in `model_version.artifact_uri`.' }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: 'SHA-256 of the model file; stored in `model_version.artifact_sha256`.' }
        featureSchemaVersion: { type: string, example: v1, description: Version of `docs/features.md` the model was trained on. }
        metrics: { $ref: '#/components/schemas/Metrics' }
        trainedAt: { type: string, format: date-time }

    ActiveModel:
      type: object
      required: [version, loadedAt]
      properties:
        version: { type: string, example: v3 }
        loadedAt: { type: string, format: date-time }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [UP, DEGRADED] }
        activeModel: { type: [string, 'null'], example: v3, description: Null when no model is loaded (status DEGRADED). }

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type: { type: string, format: uri, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
