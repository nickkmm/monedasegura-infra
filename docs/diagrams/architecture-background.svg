#archBackground .bd{font-size:10.5px;font-weight:700;fill:#fff;letter-spacing:.04em}
#archBackground .zl{font-size:11.5px;font-weight:700;fill:#79809A;letter-spacing:.06em}
#archBackground .el{font-size:11.5px;fill:#556074}
#archBackground .st{font-size:11px;font-weight:700;fill:#fff}
#archBackground .lg{font-size:12px;fill:#556074}
</style>
