<svg id="archBackground" viewBox="0 0 1056 920" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title id="archBackground-t">MonedaSegura MVP: background flows</title><desc id="archBackground-d">A: decision-api publishes every decision to Kafka; the re-evaluator consumes it and sends degraded decisions back to decision-api, which re-scores them with the original features. B: at 02:00 the retrainer reads labeled cases from Postgres and calls scoring-api /retrain, which uploads the new model to the models bucket (SeaweedFS, S3 API). C: the seed-job downloads Sparkov and loads it into Postgres once. D: when Redis has lost its data, the rebuilder reads the last 24 h from Postgres and writes the Redis keys again.</desc>
