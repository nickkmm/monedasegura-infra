<text class="zl" x="32" y="310">B · DAILY RETRAINING AT 02:00</text>
<rect x="16" y="488" width="752" height="124" rx="14" fill="#F3F4F8" stroke="#D5D9E4" stroke-width="1.25" stroke-dasharray="6 5"/>
<text class="zl" x="32" y="510">C · INITIAL SEED (RUNS ONCE)</text>
