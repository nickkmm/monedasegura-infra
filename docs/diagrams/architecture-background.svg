<text x="32" y="44" font-size="20" font-weight="700" fill="#161A26">MonedaSegura MVP: background flows</text>
<text x="32" y="66" font-size="13" fill="#79809A">Flows off the critical path: nobody waits for them. Each band is one flow, read left to right.</text>
<rect x="16" y="88" width="752" height="124" rx="14" fill="#F3F4F8" stroke="#D5D9E4" stroke-width="1.25" stroke-dasharray="6 5"/>
