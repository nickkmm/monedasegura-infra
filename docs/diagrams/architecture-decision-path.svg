<svg id="archDecision" viewBox="0 0 1056 720" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title id="archDecision-t">MonedaSegura MVP: decision path</title><desc id="archDecision-d">The Flutter app sends the transaction to decision-api (1), which reads the customer's recent facts from Redis to count short windows (2) and the profile and 30-day history from Postgres (3), asks scoring-api for a score behind a circuit breaker (4), stores the transaction, decision and features in Postgres (5) and only then updates the Redis keys (6). If Redis fails or is empty, the counters are computed from Postgres. scoring-api serves its model from memory, loaded from the models bucket (SeaweedFS, S3 API).</desc>
