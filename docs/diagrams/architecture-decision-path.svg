<svg id="archDecision" viewBox="0 0 1056 720" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title id="archDecision-t">MonedaSegura MVP: decision path</title><desc id="archDecision-d">The Flutter app sends the transaction to decision-api (1), which reads features from Redis (2), asks scoring-api for a score behind a circuit breaker (3) and stores everything in Postgres (4). If Redis fails, features are recomputed from Postgres. scoring-api loads its model from the model volume.</desc>
